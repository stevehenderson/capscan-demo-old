name: capscan-sweep

# Weekly review of capabilities that no Dependabot pull request will surface:
# language version gates, base images, and dependencies that have drifted behind.
# Every step that needs a shell runs before the agent starts.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: capscan-sweep
  cancel-in-progress: false

env:
  ALLOWED_HOSTS: github.com docs.github.com go.dev pkg.go.dev nodejs.org www.npmjs.com docs.npmjs.com expressjs.com hub.docker.com

jobs:
  scan:
    name: Sweep for capabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read # the agent reads the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: mkdir capscan-input

      # govulncheck reports standard library vulnerabilities for the Go version it runs with,
      # so it uses the version the project builds with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-inventory/go.mod
          cache: false

      - name: "Go: reachable vulnerabilities"
        working-directory: go-inventory
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... > ../capscan-input/govulncheck.txt 2>&1 || true

      - name: "Go: GODEBUG defaults at the current and latest go directive"
        working-directory: go-inventory
        run: |
          target=$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -n1)
          # Both lists must come from the same toolchain, since DefaultGODEBUG only reports
          # settings that differ from that toolchain's own defaults.
          export GOTOOLCHAIN=$target
          target=${target#go}
          mains() { go list -f '{{if eq .Name "main"}}{{.DefaultGODEBUG}}{{end}}' ./... | tr ',' '\n' | sort; }
          mains > /tmp/godebug-now.txt
          cp go.mod /tmp/go.mod.orig
          go mod edit -go="$target"
          mains > /tmp/godebug-target.txt
          cp /tmp/go.mod.orig go.mod
          {
            echo "go-inventory go directive: $(go mod edit -json | jq -r .Go) -> $target"
            diff /tmp/godebug-now.txt /tmp/godebug-target.txt || true
          } > ../capscan-input/godebug-diff.txt

      - name: "Go: direct dependencies with newer versions"
        working-directory: go-inventory
        run: |
          go list -m -u -f '{{if and (not .Indirect) .Update}}{{.Path}} {{.Version}} -> {{.Update.Version}}{{end}}' all \
            > ../capscan-input/go-updates.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: node-catalog/.nvmrc

      - name: "Node: versions, outdated packages, and audit"
        working-directory: node-catalog
        run: |
          # --ignore-scripts installs packages without running any of their lifecycle scripts.
          npm ci --ignore-scripts
          latest_lts=$(curl -fsSL https://nodejs.org/dist/index.json | jq -r '[.[] | select(.lts)][0].version')
          {
            echo "node-catalog .nvmrc: $(cat .nvmrc)"
            echo "node-catalog engines.node: $(jq -r .engines.node package.json)"
            echo "node-catalog Dockerfile: $(grep -m1 '^FROM' Dockerfile)"
            echo "go-inventory Dockerfile: $(grep -m1 '^FROM' ../go-inventory/Dockerfile)"
            echo "latest Node LTS: $latest_lts"
          } > ../capscan-input/versions.txt
          npm outdated --json > ../capscan-input/npm-outdated.json || true
          npm audit --json > ../capscan-input/npm-audit.json || true

      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Follow the rules in .github/capscan/RULES.md exactly.
            This is the weekly sweep, so the "Stay in scope" rule applies to the gap between each
            version this repository declares and the latest release.
            The capscan-input directory holds facts gathered before you started:
            govulncheck.txt, godebug-diff.txt, go-updates.txt, versions.txt, npm-outdated.json, npm-audit.json.
            Report reachable vulnerabilities first.
            Then review capabilities gated by the go directive, the Node version (.nvmrc, engines, Dockerfile),
            and the outdated direct dependencies. Use godebug-diff.txt to list Go defaults that would change.
            Write the report to capscan-report.md in the repository root.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Write,WebFetch(domain:github.com),WebFetch(domain:docs.github.com),WebFetch(domain:go.dev),WebFetch(domain:pkg.go.dev),WebFetch(domain:nodejs.org),WebFetch(domain:www.npmjs.com),WebFetch(domain:docs.npmjs.com),WebFetch(domain:expressjs.com),WebFetch(domain:hub.docker.com)"

      - name: Verify citations and links
        run: .github/capscan/verify-report.sh capscan-report.md $ALLOWED_HOSTS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capscan-report
          path: capscan-report.md
          if-no-files-found: ignore

  issue:
    name: Open the sweep issue
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      issues: write # the only write permission, held by a job that never runs the agent
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: capscan-report

      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s capscan-report.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "capscan: weekly capability sweep $(date +%F)" \
              --body-file capscan-report.md
          fi
